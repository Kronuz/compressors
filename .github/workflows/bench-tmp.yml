name: bench-tmp
on:
  pull_request:
jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Packages
        run: |
          if [ "$(uname)" = Darwin ]; then brew install zstd lz4; else sudo apt-get update -q && sudo apt-get install -y -q libzstd-dev liblz4-dev zlib1g-dev; fi
      - name: Build
        run: |
          uname -a
          git clone -q --depth 1 --branch v0.8.3 https://github.com/Cyan4973/xxHash xxHash
          mkdir base && git archive d82b1d8 | tar -x -C base
          if [ "$(uname)" = Darwin ]; then P=$(brew --prefix); INC="-I$P/include"; LIB="-L$P/lib"; CXX=clang++; else INC=""; LIB=""; CXX=c++; fi
          R="$CXX -std=c++20 -O3 -DNDEBUG $INC"
          $R -Ibase -IxxHash bench/bench_xxh32.cc -o xx_base
          $R -I. -IxxHash bench/bench_xxh32.cc -o xx_new
          $R -Ibase bench/bench_lz4.cc base/compressor_lz4.cc $LIB -llz4 -o lz4_base
          $R -I. bench/bench_lz4.cc compressor_lz4.cc $LIB -llz4 -o lz4_new
          $R -I. bench/bench_oneshot.cc compressor_zstd.cc compressor_deflate.cc $LIB -lzstd -lz -o oneshot
      - name: Assembly identity of XXH32 (old header against new)
        run: |
          mkdir -p probe; printf '%s\n' '#include "xxh32_stream.h"' 'extern "C" int upd(compressors::XXH32_state_t* s, const void* p, size_t n) { return compressors::XXH32_update(s, p, n); }' 'extern "C" unsigned dig(const compressors::XXH32_state_t* s) { return compressors::XXH32_digest(s); }' 'extern "C" void rst(compressors::XXH32_state_t* s, unsigned seed) { compressors::XXH32_reset(s, seed); }' > probe/probe.cc
          if [ "$(uname)" = Darwin ]; then CXX=clang++; else CXX=c++; fi
          $CXX -std=c++20 -O3 -DNDEBUG -S -Ibase probe/probe.cc -o probe_old.s
          $CXX -std=c++20 -O3 -DNDEBUG -S -I. probe/probe.cc -o probe_new.s
          grep -v -E '^\s*(\.(file|ident|loc|cfi_|section|build_version|p2align|globl|type|size|text|addrsig|subsections_via_symbols)|#|//)' probe_old.s | sed 's/[[:space:]]\+/ /g' > a.txt
          grep -v -E '^\s*(\.(file|ident|loc|cfi_|section|build_version|p2align|globl|type|size|text|addrsig|subsections_via_symbols)|#|//)' probe_new.s | sed 's/[[:space:]]\+/ /g' > b.txt
          wc -l a.txt b.txt
          if diff a.txt b.txt > asm.diff; then echo "ASM IDENTICAL on $(uname -m)"; else echo "ASM DIFFERS on $(uname -m)"; head -40 asm.diff; fi
      - name: Mutants of the one-shot functions (each must be killed by test_oneshot)
        run: |
          if [ "$(uname)" = Darwin ]; then P=$(brew --prefix); INC="-I$P/include"; LIB="-L$P/lib"; CXX=clang++; else INC=""; LIB=""; CXX=c++; fi
          for m in dbe zex zlv; do
            $CXX -std=c++20 -O1 -Imut/$m $INC -DCOMPRESSORS_TEST_ZSTD=1 -DCOMPRESSORS_TEST_DEFLATE=1 mut/$m/test/test_oneshot.cc mut/$m/compressor_zstd.cc mut/$m/compressor_deflate.cc $LIB -lzstd -lz -pthread -o m_$m
            if ./m_$m > /dev/null 2> m_$m.err; then echo "MUTANT $m SURVIVED"; else echo "MUTANT $m KILLED: $(head -c 400 m_$m.err | head -3)"; fi
          done
      - name: Run
        run: |
          for r in 1 2 3; do
            echo "== xxh32 old round $r"; ./xx_base | grep -E "n=(2048|65536|1048576) "
            echo "== xxh32 new round $r"; ./xx_new | grep -E "n=(2048|65536|1048576) "
          done
          for r in 1 2; do
            echo "== lz4 old round $r"; ./lz4_base
            echo "== lz4 new round $r"; ./lz4_new
          done
          echo "== one-shot zstd and deflate (new)"; ./oneshot
          echo "== one-shot zstd and deflate (new, second run)"; ./oneshot
